[project]
name = "url-shortener"
version = "1.0.0"
description = "A simple Python app that shortens URLs using the TinyURL API."
authors = [
    { name = "Princess Joy", email = "princessjoyosoyagustin@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "requests",
    "flask"
]

[project.scripts]
url-shortener = "url_shortener:main"
